<h2>Edit Book</h2>

<form method="POST">

    {% csrf_token %}

    <label>Title:</label>

    <input type="text"
           name="title"
           value="{{ book.title }}">

    <br><br>

    <label>Author:</label>

    <input type="text"
           name="author"
           value="{{ book.author }}">

    <br><br>

    <input type="submit"
           value="Save Changes">

</form>
